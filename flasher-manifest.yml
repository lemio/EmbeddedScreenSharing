# Per-example metadata for the ESP32-S3-Flasher repo's reusable build/publish Action
# (https://github.com/lemio/ESP32-S3-Flasher). The Action runs a bare `pio run`, which
# builds every environment in platformio.ini, then merges this file's per-example
# name/description/variables into the generated manifest.json alongside each compiled
# binary - matched up by PlatformIO environment name, so each key under `examples:`
# below must exactly match an `[env:...]` name in platformio.ini (webJPEG, webH264,
# webJPEG-CYD, webRAW-CYD, webRAW).
#
# `recommended: true` (optional, at most one example should set this) sorts that
# example to the top of the flasher's list and shows a "Recommended" badge - see
# wizard.html's renderFirmwareList().
#
# `expectedBehavior:` (optional, wizard only) is a bulleted list shown on the final
# "What to Expect" step instead of just repeating `description` - each example's list
# below mentions the live serial output panel so first-time users know it's there and
# what it's for, not just stumble onto it.
#
# `variables[].firmware_name` must match the exact string each example's .cpp file
# reserves as a fixed-size array (e.g. `const char ssid[100] = "|*S*|";`) - it's the
# literal text the flasher searches for in the compiled binary. ssid/password have no
# sensible default (must be patched here, or before compiling); every example's
# mdnsName default value is itself both a working hostname AND the flasher's search
# key, so a board flashed without ever touching the browser flasher still gets a usable
# http://esp-screen.local. Every example shares this same "esp-screen" default now
# (previously a different name per firmware, e.g. esp-webjpeg/esp-webh264) - see
# webJPEG.cpp's mdnsName comment for why; the on-device display now shows which
# firmware/build is actually running, so the hostname no longer needs to carry that.
# Flashing more than one of these boards on the same network still needs a custom
# hostname per board (the "mDNS Hostname" field below, same as before).
#
# `hardware:` can be a plain string (shown as-is, no link) or a list of
# `{name, url}` entries when one firmware genuinely supports multiple distinct
# physical boards (e.g. webJPEG/webRAW auto-detect across the whole AMOLED lineup) -
# the flasher renders each as its own linked name rather than picking just one.
#
# Every example's compiled firmware.bin also carries a build-date marker the flasher
# reads (not patches) to show in the firmware list: a fixed `const char [] = __DATE__
# "|*FW*|"` array (see any example's .cpp, near its buildDateString()). This is a
# separate mechanism from the |*S*|/|*P*|-style variables above - those get
# overwritten with user-provided values before flashing; this one is left exactly as
# compiled and just read.
#
# `site:` (optional, alongside `examples:`) renames the flasher tool itself instead of
# leaving it as the generic "ESP32-S3 Web Flasher"/"ESP32-S3 Flash Wizard" - see
# ESP32-S3-Flasher's README.md, "Site-wide branding" section, for the full field list.
#
# NOTE on the webJPEG-CYD/webRAW-CYD entries below: the CYD is a plain ESP32 (not S3),
# connected over a CH340 USB-serial adapter, not native USB - confirmed working
# end-to-end through this same browser flasher on real CYD hardware (chip detection,
# flashing, and the classic-reset-into-bootloader pulse all work over CH340; see
# ESP32-S3-Flasher's own learnings.md for the reset-sequence and bootloader-offset
# fixes that got it there). The one CYD-specific config that does need to be right is
# the bootloader flash offset (0x1000 for a plain ESP32 vs 0x0 for ESP32-S3) - handled
# automatically per-environment by build_and_package.py's board-MCU lookup, not
# something to hardcode here.

site:
  title: Embedded Screen Sharing Flasher
  subtitle: Flash a browser-to-display video streamer straight from your browser - no PlatformIO needed

examples:
  webRAW:
    name: WebRAW Stream Display
    description: >-
      Streams a browser tab, window, or screen share to the display over WiFi,
      pixel-perfect with no compression artifacts. Best for flat, low-color content
      like UI screens or text - fast-moving video updates less often. Works on any
      AMOLED board (auto-detected).
    sourceUrl: https://github.com/lemio/EmbeddedScreenSharing/tree/main/examples/webRAW
    hardware:
      - name: LilyGo T-Display-AMOLED-Lite
        url: https://www.lilygo.cc/products/t-display-amoled-lite
      - name: LilyGo T-Display S3 AMOLED
        url: https://lilygo.cc/products/t-display-s3-amoled
      - name: LilyGo T4-S3
        url: https://lilygo.cc/products/t4-s3
    variables:
      - firmware_name: "|*S*|"
        readable_name: WiFi Name (SSID)
        default_value: ""
        max_length: 100
      - firmware_name: "|*P*|"
        readable_name: WiFi Password
        default_value: ""
        max_length: 100
      - firmware_name: esp-screen
        readable_name: mDNS Hostname
        default_value: esp-screen
        postfix: .local
        max_length: 100
    expectedBehavior:
      - Device connects to WiFi and shows its IP address and mDNS hostname on screen
      - Open the streaming page linked above and share a browser tab, window, or your whole screen
      - Live serial output below shows connection status and per-frame timing in real time

  webJPEG:
    name: WebJPEG Stream Display
    description: >-
      Streams a browser tab or screen share to the display over WiFi as a series of
      JPEG images. Simple and reliable. Works on any AMOLED board (auto-detected).
    sourceUrl: https://github.com/lemio/EmbeddedScreenSharing/tree/main/examples/webJPEG
    hardware:
      - name: LilyGo T-Display-AMOLED-Lite
        url: https://www.lilygo.cc/products/t-display-amoled-lite
      - name: LilyGo T-Display S3 AMOLED
        url: https://lilygo.cc/products/t-display-s3-amoled
      - name: LilyGo T4-S3
        url: https://lilygo.cc/products/t4-s3
    variables:
      - firmware_name: "|*S*|"
        readable_name: WiFi Name (SSID)
        default_value: ""
        max_length: 100
      - firmware_name: "|*P*|"
        readable_name: WiFi Password
        default_value: ""
        max_length: 100
      - firmware_name: esp-screen
        readable_name: mDNS Hostname
        default_value: esp-screen
        postfix: .local
        max_length: 100
    expectedBehavior:
      - Device connects to WiFi and shows its IP address and mDNS hostname on screen
      - Open the streaming page linked above and share a browser tab or your whole screen
      - Live serial output below shows connection status and per-frame timing in real time

  webH264:
    name: WebH264 Stream Display
    recommended: true
    description: >-
      Streams a browser tab or window to the display over WiFi as video, using the
      same H.264 format as most streaming apps. Sharper image and lower WiFi usage
      than WebJPEG. Works on any AMOLED board (auto-detected).
    sourceUrl: https://github.com/lemio/EmbeddedScreenSharing/tree/main/examples/webH264
    hardware:
      - name: LilyGo T-Display-AMOLED-Lite
        url: https://www.lilygo.cc/products/t-display-amoled-lite
      - name: LilyGo T-Display S3 AMOLED
        url: https://lilygo.cc/products/t-display-s3-amoled
      - name: LilyGo T4-S3
        url: https://lilygo.cc/products/t4-s3
    variables:
      - firmware_name: "|*S*|"
        readable_name: WiFi Name (SSID)
        default_value: ""
        max_length: 100
      - firmware_name: "|*P*|"
        readable_name: WiFi Password
        default_value: ""
        max_length: 100
      - firmware_name: esp-screen
        readable_name: mDNS Hostname
        default_value: esp-screen
        postfix: .local
        max_length: 100
    expectedBehavior:
      - Device connects to WiFi and shows its IP address and mDNS hostname on screen
      - Open the streaming page linked above and share a browser tab or window
      - Live serial output below shows connection status and per-frame timing in real time

  webJPEG-CYD:
    name: WebJPEG Stream Display (CYD)
    description: >-
      Streams a browser tab or screen share to the display over WiFi as a series of
      JPEG images. Works on the cheap "Cheap Yellow Display" (CYD) board.
    sourceUrl: https://github.com/lemio/EmbeddedScreenSharing/tree/main/examples/webJPEG-CYD
    hardware:
      - name: CYD (ESP32-2432S028R)
        url: https://nl.aliexpress.com/item/1005004971720824.html
    variables:
      - firmware_name: "|*S*|"
        readable_name: WiFi Name (SSID)
        default_value: ""
        max_length: 100
      - firmware_name: "|*P*|"
        readable_name: WiFi Password
        default_value: ""
        max_length: 100
      - firmware_name: esp-screen
        readable_name: mDNS Hostname
        default_value: esp-screen
        postfix: .local
        max_length: 100
      - firmware_name: "|*ROTATION*|"
        readable_name: Screen Rotation
        type: enum
        options:
          - value: "0"
            label: Normal
          - value: "2"
            label: Upside down
        default_value: "0"
        max_length: 16
      - firmware_name: "|*INVERT*|"
        readable_name: Invert Colors
        type: enum
        options:
          - value: "0"
            label: Normal
          - value: "1"
            label: Inverted (some CYD variants need this)
        default_value: "0"
        max_length: 16
    expectedBehavior:
      - Device connects to WiFi and shows its IP address and mDNS hostname on screen
      - Open the streaming page linked above and share a browser tab or your whole screen
      - Live serial output below shows connection status and per-frame timing in real time

  webRAW-CYD:
    recommended: true
    name: WebRAW Stream Display (CYD)
    description: >-
      Streams a browser tab, window, or screen share to the display over WiFi,
      pixel-perfect with no compression artifacts. Works on the cheap "Cheap Yellow
      Display" (CYD) board - the recommended pick there, since it renders 3-6x faster
      than WebJPEG-CYD by pushing whole strips of pixels at once instead of many
      small blocks.
    sourceUrl: https://github.com/lemio/EmbeddedScreenSharing/tree/main/examples/webRAW-CYD
    hardware: CYD (ESP32-2432S028R)
    variables:
      - firmware_name: "|*S*|"
        readable_name: WiFi Name (SSID)
        default_value: ""
        max_length: 100
      - firmware_name: "|*P*|"
        readable_name: WiFi Password
        default_value: ""
        max_length: 100
      - firmware_name: esp-screen
        readable_name: mDNS Hostname
        default_value: esp-screen
        postfix: .local
        max_length: 100
      - firmware_name: "|*ROTATION*|"
        readable_name: Screen Rotation
        type: enum
        options:
          - value: "0"
            label: Normal
          - value: "2"
            label: Upside down
        default_value: "0"
        max_length: 16
      - firmware_name: "|*INVERT*|"
        readable_name: Invert Colors
        type: enum
        options:
          - value: "0"
            label: Normal
          - value: "1"
            label: Inverted (some CYD variants need this)
        default_value: "0"
        max_length: 16
    expectedBehavior:
      - Device connects to WiFi and shows its IP address and mDNS hostname on screen
      - Open the streaming page linked above and share a browser tab, window, or your whole screen
      - Live serial output below shows connection status and per-frame timing in real time
