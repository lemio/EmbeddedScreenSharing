; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; This repo has several example projects under examples/, all built from this one
; shared src_dir - see examples/CMakeLists.txt for how each ESP-IDF-based env's
; sources are scoped (build_src_filter below handles the plain-Arduino ones):
;
; - examples/webJPEG (env: webJPEG) - MJPEG over WebSocket, plain Arduino framework.
; - examples/webRAW (env: webRAW) - raw RGB565 pixels, browser-side deflate-
;   compressed, over WebSocket - no JPEG involved. Same AMOLED board/board-detection
;   as webJPEG, different wire protocol - see examples/webRAW/webRAW.cpp.
; - examples/webH264 (env: webH264) - H.264 over WebSocket, needs Arduino built as an
;   ESP-IDF component (framework = arduino, espidf below) since esp_h264 ships as a
;   prebuilt IDF component - see examples/webH264/webH264.cpp for why.
; - examples/webJPEG-CYD (env: webJPEG-CYD) - MJPEG over WebSocket, ported for the
;   "Cheap Yellow Display" (ESP32-2432S028R): a plain ESP32 with no PSRAM, outside the
;   LilyGo AMOLED lineup entirely. webH264 isn't an option there - see that example's
;   file header comment for why (esp_h264 has no plain-ESP32 build at all).
; - examples/webRAW-CYD (env: webRAW-CYD) - webRAW's wire protocol, ported to the same
;   CYD board as webJPEG-CYD - see examples/webRAW-CYD/webRAW-CYD.cpp.
;
; webJPEG, webRAW and webH264 auto-detect the attached panel at boot, so they work
; across the whole T-Display-AMOLED lineup:
; https://www.lilygo.cc/products/t-display-amoled-lite
; https://www.lilygo.cc/products/t-display-s3-amoled
; https://www.lilygo.cc/products/t4-s3
src_dir = examples

;! Don't make changes
boards_dir = boards

[env]
lib_extra_dirs = ${PROJECT_DIR}
; lib_extra_dirs = ${PROJECT_DIR} makes LDF discover the whole repo root as a library,
; exposing src/LilyGo_AMOLED.h to every example.
lib_ignore =
    lib_deps
    examples
platform = espressif32@6.7.0
framework = arduino
upload_speed =  921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; USB host example must disable usb cdc
    ; Enable -UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DCORE_DEBUG_LEVEL=1

monitor_filters =
	default
	esp32_exception_decoder

lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    bodmer/TFT_eSPI @ 2.5.31
    FS
    SPIFFS
    SD
    esp32async/ESPAsyncWebServer @ ^3.9.2
    esp32async/AsyncTCP @ ^3.4.9
    bodmer/JPEGDecoder @ ^2.0.0

[env:webJPEG]
extends = env
board = T-Display-AMOLED
; ignore all code except the code in webJPEG/ (and of course the lib/lib_deps folder)
build_src_filter= -<*> +<webJPEG/>
build_flags =
    ${env.build_flags}

[env:webRAW]
extends = env
board = T-Display-AMOLED
; [env]'s 921600 (documented above that comment as confirmed fine on the AMOLED
; boards' native-USB-JTAG upload path) failed consistently on real hardware testing
; here (4/4 attempts: "Changing baud rate to 921600" then "No serial data received",
; every time, on an otherwise-healthy connection - esptool could always talk to the
; chip and identify it first). 115200 succeeded immediately once tried explicitly
; (confirmed via a direct esptool call, then reproduced through this env override).
; Slower, but reliable - don't "fix" upload trouble on this board by raising it back
; without testing on hardware first. If your own board handles 921600 fine, this is a
; safe env to override upward again since it's scoped to just this one.
upload_speed = 115200
; ignore all code except the code in webRAW/ (and of course the lib/lib_deps folder)
build_src_filter= -<*> +<webRAW/>
build_flags =
    ${env.build_flags}
    ; Confirmed on a plain ESP32 (see [env:webRAW-CYD] below and webRAW-CYD.cpp's
    ; drawRawStrips()): tinfl_decompress_mem_to_mem()'s internal decompressor state is
    ; declared on the caller's stack inside the ROM function (not the heap) and is
    ; ~10.7KB by itself - more than Arduino's default 8KB loopTask stack. The ROM
    ; header is confirmed byte-identical between the plain esp32 and esp32s3 SDKs (see
    ; webRAW.cpp's file header), so this board needs the same headroom pre-emptively,
    ; not just after hitting the same crash here too.
    -DARDUINO_LOOP_STACK_SIZE=32768
; Inherits ${env.lib_deps} unchanged, same as [env:webJPEG] above - this still needs
; lvgl/XPowersLib/SensorLib/etc. for LilyGo_AMOLED itself (amoled.begin() and
; friends), even though webRAW.cpp doesn't use lvgl directly. JPEGDecoder in that
; list goes unused here (decompression uses the ESP32 ROM's built-in miniz instead -
; see webRAW.cpp) but isn't worth a separate lib_deps list just to drop it.

[env:webH264]
board = T-Display-AMOLED
; Overrides the board's default_16MB.csv (a small single-app slot meant for the plain
; Arduino/SCons examples) - this env's sdkconfig.defaults also sets
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME to the same file, but PlatformIO's own
; espressif32 platform independently derives a partition table from board_build.partitions
; for its own flashing-offset bookkeeping, and that one wins if the two disagree -
; without this, this example silently builds against a 1MB app partition instead of the
; roomy one esp_h264 + WiFi + display libs actually need (see partitions.webH264.csv).
board_build.partitions = partitions.webH264.csv
; This repo's own src/ (LilyGo_AMOLED fork) is compiled explicitly via
; examples/CMakeLists.txt instead (ESP-IDF/CMake needs every source file listed, unlike
; SCons's implicit lib_extra_dirs discovery). Ignore it here too, or LDF discovers and
; compiles it a second time under its folder name "src" - harmless (the linker drops
; the unreferenced duplicate) but a slower rebuild every time src/ changes.
lib_ignore = ${env.lib_ignore}
    src
; See examples/webH264/webH264.cpp for why this example needs Arduino built as an
; ESP-IDF component instead of the plain Arduino framework every other env here uses.
framework = arduino, espidf
; ESP-IDF/CMake ignores build_src_filter, so examples/CMakeLists.txt lists this
; example's files explicitly instead (see that file).
build_flags =
    ${env.build_flags}
; A minimal, explicit list rather than inheriting ${env.lib_deps} above: only what
; webH264.cpp and this repo's own src/ (see examples/CMakeLists.txt) need. lvgl is a
; partial exception - webH264.cpp doesn't use it, but src/LV_Helper.cpp does.
;
; Do not add xinyuan-lilygo/LilyGo-AMOLED-Series here. Under this builder each lib_deps
; entry becomes its own component, so that plus this repo's own src/ (via
; examples/CMakeLists.txt) would compile two divergent copies of LilyGo_AMOLED and
; silently link whichever one the linker resolves first - previously the unmodified
; upstream copy, not this repo's fork. See examples/CMakeLists.txt.
monitor_filters = time
lib_deps =
    lewisxhe/XPowersLib @ 0.2.7
    lewisxhe/SensorLib @ 0.2.4
    bodmer/TFT_eSPI @ 2.5.31
    lvgl/lvgl @ 8.4.0
    FS
    SPIFFS
    SD
    esp32async/ESPAsyncWebServer @ ^3.9.2
    esp32async/AsyncTCP @ ^3.4.9

[env:webJPEG-CYD]
extends = env
; A plain ESP32 (not S3) dev module - platformio's built-in "esp32dev" board matches
; the CYD's hardware (ESP32-WROOM-32, 4MB flash, no PSRAM) closely enough that a
; custom board JSON isn't needed, unlike T-Display-AMOLED above.
board = esp32dev
; [env]'s 921600 (confirmed fine on the AMOLED boards' native-USB-JTAG upload path)
; failed outright here on real hardware ("Unable to verify flash chip connection").
; This board uploads through a CH340 USB-to-serial chip, not native USB - a much more
; common place for upload speed to matter. 115200 consistently died partway into the
; ~900KB firmware write (8 attempts, unaffected by USB port or cable) - looked like a
; cable/power issue at first, but turned out to be specific to that baud: 460800
; completed cleanly and quickly (2/2 real-hardware attempts, ~15-30s total vs 91s+ at
; 115200). Slower isn't safer here - don't "fix" upload trouble on this board by
; lowering this further without testing on hardware first.
upload_speed = 460800
build_src_filter = -<*> +<webJPEG-CYD/>
build_flags =
    ${env.build_flags}
    ; [env]'s -DARDUINO_USB_CDC_ON_BOOT=1 above is for chips with native USB (S2/S3/C3)
    ; where it makes Serial become the USB-CDC object. This board is a plain ESP32 -
    ; no native USB, Serial output goes over its UART-to-USB bridge chip regardless -
    ; and leaving that flag set here doesn't just do nothing, it makes the Arduino
    ; core skip defining the global `Serial` object at all (confirmed by a real build
    ; failure: "error: 'Serial' was not declared in this scope").
    -UARDUINO_USB_CDC_ON_BOOT
    ; This board has no PSRAM - [env]'s -DBOARD_HAS_PSRAM above is wrong here and
    ; would make libraries assume PSRAM exists (see examples/webJPEG-CYD/webJPEG-CYD.cpp's
    ; file header for the memory-budget consequences of that).
    -UBOARD_HAS_PSRAM
    ; TFT_eSPI pin mapping for the ESP32-2432S028R ("CYD") board's onboard 2.8" ILI9341,
    ; supplied entirely here instead of editing TFT_eSPI's own User_Setup.h - this is
    ; TFT_eSPI's documented way to configure via build system rather than editing
    ; library files in place. This board isn't part of LilyGo_AMOLED's lineup at all,
    ; so none of that library's board-detection logic applies or is used here.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    ; Confirmed on real hardware during rotation debugging: this panel showed blue
    ; where red was expected (a plain red test rectangle rendered blue) - a real
    ; RGB/BGR channel-order mismatch, not touched by the width/height/rotation fixes
    ; below. Likely also the cause of "noise"/gamma-looking artifacts in actual JPEG
    ; content, where wrong channel order is far more visually chaotic than on a flat
    ; test color. See learnings.md.
    ;
    ; MUST be the literal integer 1, not the symbolic TFT_BGR/TFT_RGB names - TFT_eSPI's
    ; ILI9341_Defines.h checks `#if (TFT_RGB_ORDER == 1)` for RGB, else BGR. An earlier
    ; attempt here set -DTFT_RGB_ORDER=TFT_BGR, which is a silent no-op: TFT_BGR isn't a
    ; macro at that point, undefined identifiers evaluate to 0 in #if, so
    ; `TFT_RGB_ORDER == 1` was always false regardless - landing on the exact same BGR
    ; default as not setting the flag at all, which is why it visibly changed nothing.
    -DTFT_RGB_ORDER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
; Minimal set actually used by webJPEG-CYD.cpp - no lvgl/XPowersLib/SensorLib/SD (all
; LilyGo_AMOLED-lineup concerns this board has nothing to do with).
lib_deps =
    bodmer/TFT_eSPI @ 2.5.31
    esp32async/ESPAsyncWebServer @ ^3.9.2
    esp32async/AsyncTCP @ ^3.4.9
    bodmer/JPEGDecoder @ ^2.0.0

[env:webRAW-CYD]
; Same physical board as webJPEG-CYD (same board pin config/upload speed/RGB order
; fix, all inherited below) - just a different wire protocol. See
; examples/webRAW-CYD/webRAW-CYD.cpp's file header for what and why.
extends = env:webJPEG-CYD
build_src_filter = -<*> +<webRAW-CYD/>
build_flags =
    ${env:webJPEG-CYD.build_flags}
    ; Confirmed on real hardware: a "Stack canary watchpoint triggered (loopTask)"
    ; crash, right inside drawRawStrips()'s tinfl_decompress_mem_to_mem() call.
    ; tinfl_decompress_mem_to_mem()'s internal tinfl_decompressor state (declared on
    ; the caller's stack inside the ROM function, not the heap) is ~10.7KB by itself -
    ; 3x tinfl_huff_table, each holding a 1024-entry mz_int16 lookup table plus a
    ; 288-entry Huffman tree - which alone exceeds Arduino's default 8KB loopTask
    ; stack. 32KB leaves generous headroom beyond that one struct for the rest of the
    ; loop()->drawRawStrips() call chain. See learnings.md.
    -DARDUINO_LOOP_STACK_SIZE=32768
; No JPEGDecoder - decompression uses the ESP32 ROM's built-in miniz
; (tinfl_decompress_mem_to_mem(), see webRAW-CYD.cpp) instead of an external library.
lib_deps =
    bodmer/TFT_eSPI @ 2.5.31
    esp32async/ESPAsyncWebServer @ ^3.9.2
    esp32async/AsyncTCP @ ^3.4.9

